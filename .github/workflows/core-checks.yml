name: Core Checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Feather/Core/**', 'Tests/**', 'Package.swift', '.github/workflows/core-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test navigation, releases, and transfer copying
        run: swift test
