name: Build IPA

on:
  push:
    branches: [main]
    paths: ['Feather/**', 'FeatherWidget/**', 'Feather.xcodeproj/**', 'Feather.xcconfig', 'Package.swift', 'Tests/**', 'patches/**', 'NimbleKit/**', '.github/workflows/build-ipa.yml']
  workflow_dispatch:
    inputs:
      runner:
        description: Mac runner
        type: choice
        options: [macos-15-intel, macos-26]
        default: macos-26
      include_transfer_helper:
        description: Bundle the optional legacy transfer installer
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-iphone-build-${{ github.ref }}-${{ inputs.runner || 'macos-26' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply Zsign patches
        run: for patch in patches/zsign-*.patch; do git -C Zsign apply "../$patch"; done
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: |
            ${{ runner.temp }}/Feather
            ~/Library/Caches/org.swift.swiftpm
          key: feather-xcode26.3-${{ runner.arch }}-${{ hashFiles('Feather.xcworkspace/xcshareddata/swiftpm/Package.resolved', '.gitmodules') }}
          restore-keys: feather-xcode26.3-${{ hashFiles('Feather.xcworkspace/xcshareddata/swiftpm/Package.resolved', '.gitmodules') }}
      - name: Test update and navigation rules
        run: |
          if [ -f Package.swift ]; then swift test; fi
      - name: Prepare install server assets
        run: make deps
      - name: Resolve Swift packages
        run: |
          set -o pipefail
          git config --global http.version HTTP/1.1
          for attempt in 1 2; do
            if xcodebuild -resolvePackageDependencies -workspace Feather.xcworkspace -scheme Feather \
              -derivedDataPath "$RUNNER_TEMP/Feather" 2>&1 | tee "$RUNNER_TEMP/build.log"; then exit 0; fi
          done
          exit 1
      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild -workspace Feather.xcworkspace -scheme Feather -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/Feather" \
            -disableAutomaticPackageResolution -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            FEATHER_PRODUCT_BUNDLE_IDENTIFIER=dev.madebynuz.dev.feather \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Package IPA for device signing
        run: |
          set -euo pipefail
          APP="$(find _build -type d -name Feather.app | head -n 1)"
          test -n "$APP"
          mkdir -p packages "$RUNNER_TEMP/package/Payload"
          ditto "$APP" "$RUNNER_TEMP/package/Payload/Feather.app"
          cp deps/server.crt deps/server.pem deps/commonName.txt "$RUNNER_TEMP/package/Payload/Feather.app/"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/packages/Feather.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/packages/Feather.ipa"
      - name: Build regular Feather transfer helper
        if: inputs.include_transfer_helper == true
        run: |
          set -euo pipefail
          HELPER="$RUNNER_TEMP/feather-transfer-files"
          mkdir -p "$HELPER"
          cp Feather/Views/Settings/Transfer/*.swift "$HELPER/"
          cp Feather/Backend/Updates/Core/TransferFiles.swift "$HELPER/"
          cp Feather/Backend/Storage/Storage.swift "$HELPER/"
          git restore --source=31ab6de --worktree -- Feather
          mkdir -p Feather/Views/Settings/Transfer Feather/Backend/Updates/Core
          cp "$HELPER/DataTransferView.swift" "$HELPER/FeatherTransfer.swift" Feather/Views/Settings/Transfer/
          cp "$HELPER/TransferFiles.swift" Feather/Backend/Updates/Core/
          cp "$HELPER/Storage.swift" Feather/Backend/Storage/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Feather/Views/Settings/SettingsView.swift')
          s = p.read_text()
          s = s.replace('NBSection(.localized("Features")) {', 'NBSection(.localized("Features")) {\n                    NavigationLink(destination: DataTransferView()) { Label("Backups", systemImage: "externaldrive") }')
          p.write_text(s)
          PY
          xcodebuild -resolvePackageDependencies -workspace Feather.xcworkspace -scheme Feather \
            -derivedDataPath "$RUNNER_TEMP/Feather" 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          xcodebuild -workspace Feather.xcworkspace -scheme Feather -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/Feather" \
            -disableAutomaticPackageResolution -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            FEATHER_PRODUCT_BUNDLE_IDENTIFIER=thewonderofyou.Feather \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
            2>&1 | tee -a "$RUNNER_TEMP/build.log"
          mkdir -p "$RUNNER_TEMP/helper-package/Payload"
          ditto _build/Applications/Feather.app "$RUNNER_TEMP/helper-package/Payload/Feather.app"
          cp deps/server.crt deps/server.pem deps/commonName.txt "$RUNNER_TEMP/helper-package/Payload/Feather.app/"
          cd "$RUNNER_TEMP/helper-package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/packages/Feather-Transfer.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/packages/Feather-Transfer.ipa"
          cp "$GITHUB_WORKSPACE/packages/Feather-Transfer.ipa" "$RUNNER_TEMP/package/Payload/Feather.app/LegacyTransfer.ipa"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/packages/Feather.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Feather-iPhone-IPA
          path: packages/*.ipa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always() && steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ runner.temp }}/Feather
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Save build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
