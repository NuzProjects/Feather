name: Build IPA

on:
  push:
    branches: [main]
    paths: ['Feather/**', 'Feather.xcodeproj/**', 'Feather.xcconfig', 'Package.swift', 'Tests/**', '.github/workflows/build-ipa.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check Xcode
        run: xcodebuild -version
      - name: Test update and navigation rules
        run: |
          if [ -f Package.swift ]; then swift test; fi
      - name: Prepare install server assets
        run: make deps
      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild -project Feather.xcodeproj -scheme Feather -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/Feather" \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            FEATHER_PRODUCT_BUNDLE_IDENTIFIER=dev.madebynuz.Feather \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Package IPA for device signing
        run: |
          set -euo pipefail
          APP="$(find _build -type d -name Feather.app -maxdepth 4 | head -n 1)"
          test -n "$APP"
          mkdir -p packages "$RUNNER_TEMP/package/Payload"
          ditto "$APP" "$RUNNER_TEMP/package/Payload/Feather.app"
          cp deps/server.crt deps/server.pem deps/commonName.txt "$RUNNER_TEMP/package/Payload/Feather.app/"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/packages/Feather.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/packages/Feather.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Feather-iPhone-IPA
          path: packages/Feather.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Save build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
