name: Build IPA

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Mac runner
        type: choice
        options: [macos-15-intel, macos-26]
        default: macos-26
      include_transfer_helper:
        description: Bundle the optional legacy transfer installer
        type: boolean
        default: false
      publish_release:
        description: Publish a GitHub release so Settings → Updates shows it (notes come from .github/release-notes.md)
        type: boolean
        default: false
      delete_beta_releases:
        description: Only delete every beta pre-release and its tag (skips the build)
        type: boolean
        default: false
      keep_newest_beta:
        description: When deleting betas, keep the newest one
        type: boolean
        default: false
      clear_run_history:
        description: Only delete past workflow runs and their artifacts (skips the build)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-iphone-build-${{ github.ref }}-${{ inputs.runner || 'macos-26' }}
  cancel-in-progress: true

jobs:
  delete-beta-releases:
    if: inputs.delete_beta_releases == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete beta pre-releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.prerelease == true and (.tag_name | test("beta"; "i"))) | "\(.created_at) \(.tag_name)"' \
            | sort -r | awk '{print $2}' > tags.txt
          if [ "${{ inputs.keep_newest_beta }}" = "true" ]; then
            echo "Keeping $(head -n 1 tags.txt)"
            sed -i '1d' tags.txt
          fi
          echo "Deleting $(wc -l < tags.txt) beta releases"
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "Deleting $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done < tags.txt
  clear-run-history:
    if: inputs.clear_run_history == true
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete past workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/actions/runs?status=completed&per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${{ github.run_id }}) | .id" > runs.txt
          echo "Deleting $(wc -l < runs.txt) runs"
          while read -r id; do
            [ -n "$id" ] || continue
            gh api -X DELETE "repos/$GH_REPO/actions/runs/$id" || echo "Could not delete $id"
          done < runs.txt
  build:
    if: inputs.delete_beta_releases != true && inputs.clear_run_history != true
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply Zsign patches
        run: for patch in patches/zsign-*.patch; do git -C Zsign apply "../$patch"; done
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: |
            ${{ runner.temp }}/Feather
            ~/Library/Caches/org.swift.swiftpm
          key: feather-xcode26.3-${{ runner.arch }}-${{ hashFiles('Feather.xcworkspace/xcshareddata/swiftpm/Package.resolved', '.gitmodules') }}
          restore-keys: feather-xcode26.3-${{ hashFiles('Feather.xcworkspace/xcshareddata/swiftpm/Package.resolved', '.gitmodules') }}
      - name: Drop cached modules built against an older SDK
        run: rm -rf "$RUNNER_TEMP/Feather/ModuleCache.noindex" "$RUNNER_TEMP/Feather/SDKStatCaches.noindex" "$RUNNER_TEMP/Feather/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules"
      - name: Test update and navigation rules
        run: |
          if [ -f Package.swift ]; then swift test; fi
      - name: Prepare install server assets
        run: make deps
      - name: Resolve Swift packages
        run: |
          set -o pipefail
          git config --global http.version HTTP/1.1
          for attempt in 1 2; do
            if xcodebuild -resolvePackageDependencies -workspace Feather.xcworkspace -scheme Feather \
              -derivedDataPath "$RUNNER_TEMP/Feather" 2>&1 | tee "$RUNNER_TEMP/build.log"; then exit 0; fi
          done
          exit 1
      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild -workspace Feather.xcworkspace -scheme Feather -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/Feather" \
            -disableAutomaticPackageResolution -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            FEATHER_PRODUCT_BUNDLE_IDENTIFIER=dev.madebynuz.dev.feather \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Package IPA for device signing
        run: |
          set -euo pipefail
          APP="$(find _build -type d -name Feather.app | head -n 1)"
          test -n "$APP"
          mkdir -p packages "$RUNNER_TEMP/package/Payload"
          ditto "$APP" "$RUNNER_TEMP/package/Payload/Feather.app"
          cp deps/server.crt deps/server.pem deps/commonName.txt "$RUNNER_TEMP/package/Payload/Feather.app/"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/packages/Feather.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/packages/Feather.ipa"
      - name: Build regular Feather transfer helper
        if: inputs.include_transfer_helper == true
        run: |
          set -euo pipefail
          HELPER="$RUNNER_TEMP/feather-transfer-files"
          mkdir -p "$HELPER"
          cp Feather/Views/Settings/Transfer/*.swift "$HELPER/"
          cp Feather/Backend/Updates/Core/TransferFiles.swift "$HELPER/"
          cp Feather/Backend/Storage/Storage.swift "$HELPER/"
          git restore --source=31ab6de --worktree -- Feather
          mkdir -p Feather/Views/Settings/Transfer Feather/Backend/Updates/Core
          cp "$HELPER/DataTransferView.swift" "$HELPER/FeatherTransfer.swift" Feather/Views/Settings/Transfer/
          cp "$HELPER/TransferFiles.swift" Feather/Backend/Updates/Core/
          cp "$HELPER/Storage.swift" Feather/Backend/Storage/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Feather/Views/Settings/SettingsView.swift')
          s = p.read_text()
          s = s.replace('NBSection(.localized("Features")) {', 'NBSection(.localized("Features")) {\n                    NavigationLink(destination: DataTransferView()) { Label("Backups", systemImage: "externaldrive") }')
          p.write_text(s)
          PY
          xcodebuild -resolvePackageDependencies -workspace Feather.xcworkspace -scheme Feather \
            -derivedDataPath "$RUNNER_TEMP/Feather" 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          xcodebuild -workspace Feather.xcworkspace -scheme Feather -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/Feather" \
            -disableAutomaticPackageResolution -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            FEATHER_PRODUCT_BUNDLE_IDENTIFIER=thewonderofyou.Feather \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
            2>&1 | tee -a "$RUNNER_TEMP/build.log"
          mkdir -p "$RUNNER_TEMP/helper-package/Payload"
          ditto _build/Applications/Feather.app "$RUNNER_TEMP/helper-package/Payload/Feather.app"
          cp deps/server.crt deps/server.pem deps/commonName.txt "$RUNNER_TEMP/helper-package/Payload/Feather.app/"
          cd "$RUNNER_TEMP/helper-package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/packages/Feather-Transfer.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/packages/Feather-Transfer.ipa"
          cp "$GITHUB_WORKSPACE/packages/Feather-Transfer.ipa" "$RUNNER_TEMP/package/Payload/Feather.app/LegacyTransfer.ipa"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/packages/Feather.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Feather-iPhone-IPA
          path: packages/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        if: inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LABEL="$(sed -n 's/^FEATHER_VERSION_LABEL=//p' Feather.xcconfig)"
          SLUG="$(echo "$LABEL" | tr '[:upper:]' '[:lower:]' | sed -E 's/ beta ?/-beta/; s/ /-/g')"
          TAG="v${SLUG}-build${{ github.run_number }}"
          PRERELEASE=""
          case "$LABEL" in *[Bb]eta*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" packages/Feather.ipa --target "$GITHUB_SHA" \
            --title "Update $LABEL" --notes-file .github/release-notes.md $PRERELEASE
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "LABEL=$LABEL" >> "$GITHUB_ENV"
      - name: Add the release to the AltStore source
        if: inputs.publish_release == true && !contains(env.LABEL, 'Beta')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^FEATHER_PROJECT_VERSION=//p' Feather.xcconfig)"
          DATE="$(gh release view "$TAG" --json publishedAt --jq .publishedAt)"
          SIZE="$(stat -f%z packages/Feather.ipa)"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/Feather.ipa"
          git fetch origin main
          git checkout -B source-update origin/main
          python3 - "$VERSION" "$DATE" "$SIZE" "$URL" <<'PY'
          import json, sys
          version, date, size, url = sys.argv[1], sys.argv[2], int(sys.argv[3]), sys.argv[4]
          with open("source.json") as f:
              data = json.load(f)
          versions = [v for v in data["apps"][0]["versions"] if v["version"] != version]
          versions.insert(0, {"version": version, "date": date, "size": size, "downloadURL": url})
          data["apps"][0]["versions"] = versions
          with open("source.json", "w") as f:
              f.write(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git diff --cached --quiet && exit 0
          git commit -m "AltStore source lists Feather $VERSION"
          git push origin HEAD:main
      - uses: actions/cache/save@v4
        if: always() && steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ runner.temp }}/Feather
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Save build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
