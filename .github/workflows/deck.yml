name: Build Deck

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deck-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd Deck && xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Deck/Deck.xcodeproj -target Deck -configuration Release -sdk iphoneos \
            SYMROOT="$RUNNER_TEMP/deck" CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$RUNNER_TEMP/deck/Release-iphoneos/Deck.app" "$RUNNER_TEMP/package/Payload/Deck.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Deck.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/Deck.ipa" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: Deck-IPA
          path: Deck.ipa
          retention-days: 14

      - name: Publish to the website
        run: |
          set -euo pipefail
          mkdir -p website/deck
          cp Deck.ipa website/deck/Deck.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/deck/Deck.ipa
          git diff --cached --quiet && exit 0
          git commit -m "Publish Deck build ${{ github.run_number }}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
