name: Fully Local certificate

# Keeps local.feather.madebynuz.dev pointing at 127.0.0.1 and publishes a
# Let's Encrypt certificate for it at https://feather.madebynuz.dev/pack.json,
# which Feather's Fully Local install server uses. Runs daily and only gets a
# new certificate when the current one is missing, revoked or close to expiring.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Get a new certificate even if the current one is fine
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fully-local-cert
  cancel-in-progress: false

env:
  DOMAIN: local.feather.madebynuz.dev
  ZONE_ID: 21214b4eb943b9813749f8f9982b723e

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Point the domain at this device (127.0.0.1)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "Add the CLOUDFLARE_API_TOKEN repository secret first"; exit 1; }
          api="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records"
          body=$(jq -n --arg name "$DOMAIN" '{type:"A",name:$name,content:"127.0.0.1",ttl:3600,proxied:false,comment:"Feather Fully Local"}')
          id=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$api?type=A&name=$DOMAIN" | jq -r '.result[0].id // empty')
          if [ -n "$id" ]; then
            curl -fsS -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data "$body" "$api/$id" | jq -e '.success' >/dev/null
          else
            curl -fsS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data "$body" "$api" | jq -e '.success' >/dev/null
          fi
          echo "$DOMAIN -> 127.0.0.1"

      - name: Check the current certificate
        id: check
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess, tempfile, urllib.request

          def decide():
              if os.environ.get("FORCE") == "true":
                  return "a new certificate was requested"
              try:
                  pack = json.load(open("website/pack.json"))
              except (OSError, ValueError):
                  return "there is no certificate yet"
              if pack.get("domain") != os.environ["DOMAIN"]:
                  return "the certificate is for another domain"
              leaf = pack["cert"].split("-----END CERTIFICATE-----")[0] + "-----END CERTIFICATE-----\n"
              path = tempfile.mktemp(suffix=".pem")
              open(path, "w").write(leaf)
              if subprocess.run(["openssl", "x509", "-in", path, "-noout", "-checkend", str(30 * 86400)], capture_output=True).returncode != 0:
                  return "the certificate expires within 30 days"
              text = subprocess.check_output(["openssl", "x509", "-in", path, "-noout", "-text", "-serial"], text=True)
              serial = int(re.search(r"serial=([0-9A-Fa-f]+)", text).group(1), 16)
              crl_url = re.search(r"URI:(http\S+\.crl)", text)
              if not crl_url:
                  return None
              der = tempfile.mktemp(suffix=".crl")
              urllib.request.urlretrieve(crl_url.group(1), der)
              crl = subprocess.check_output(["openssl", "crl", "-inform", "DER", "-in", der, "-noout", "-text"], text=True)
              revoked = {int(value, 16) for value in re.findall(r"Serial Number:\s*([0-9A-Fa-f]+)", crl)}
              if serial in revoked:
                  return "the certificate was revoked"
              return None

          reason = decide()
          print(f"Renewing: {reason}" if reason else "Current certificate is valid and not revoked")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"renew={'true' if reason else 'false'}\n")
          PY

      - name: Get a certificate from Let's Encrypt
        if: steps.check.outputs.renew == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          pip install --quiet certbot certbot-dns-cloudflare
          umask 077
          printf 'dns_cloudflare_api_token = %s\n' "$CF_TOKEN" > "$RUNNER_TEMP/cloudflare.ini"
          certbot certonly --non-interactive --agree-tos --register-unsafely-without-email \
            --dns-cloudflare --dns-cloudflare-credentials "$RUNNER_TEMP/cloudflare.ini" \
            --dns-cloudflare-propagation-seconds 30 \
            --key-type rsa --rsa-key-size 2048 \
            --config-dir "$RUNNER_TEMP/le" --work-dir "$RUNNER_TEMP/le-work" --logs-dir "$RUNNER_TEMP/le-logs" \
            -d "$DOMAIN"
          rm -f "$RUNNER_TEMP/cloudflare.ini"

      - name: Write pack.json
        if: steps.check.outputs.renew == 'true'
        run: |
          set -euo pipefail
          live="$RUNNER_TEMP/le/live/$DOMAIN"
          python3 - "$live" "$DOMAIN" <<'PY'
          import json, subprocess, sys
          live, domain = sys.argv[1], sys.argv[2]
          read = lambda name: open(f"{live}/{name}").read()
          def field(flag):
              out = subprocess.check_output(["openssl", "x509", "-in", f"{live}/cert.pem", "-noout", flag], text=True).strip()
              return out.split("=", 1)[1].strip()
          issuer = field("-issuer").split("CN = ")[-1].split("CN=")[-1]
          key = read("privkey.pem")
          half = len(key) // 2
          pack = {
              "version": 1,
              "domain": domain,
              "cert": read("fullchain.pem"),
              "ca": read("chain.pem"),
              "key1": key[:half],
              "key2": key[half:],
              "info": {
                  "issuer": {"commonName": issuer},
                  "domains": {"commonName": domain, "altNames": [domain]},
                  "notBefore": field("-startdate"),
                  "notAfter": field("-enddate"),
              },
          }
          with open("website/pack.json", "w") as f:
              json.dump(pack, f, indent=2)
              f.write("\n")
          print("Valid until", pack["info"]["notAfter"])
          PY

      - name: Publish
        if: steps.check.outputs.renew == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/pack.json
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "Renew the Fully Local certificate for $DOMAIN"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
